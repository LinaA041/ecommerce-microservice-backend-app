apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-rotator-binding
  namespace: dev
  labels:
    app: secret-rotation
subjects:
- kind: ServiceAccount
  name: secret-rotator-sa
  namespace: dev
roleRef:
  kind: Role
  name: secret-rotator-role
  apiGroup: rbac.authorization.k8s.io
