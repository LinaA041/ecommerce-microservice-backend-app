rules:
  custom:
    - seriesQuery: 'rate(http_server_requests_seconds_count{namespace!="", application!=""}[1m])'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        as: "requests_per_second"
      metricsQuery: 'sum(rate(http_server_requests_seconds_count{application="{{application}}", pod="{{pod}}"}[1m]))'
