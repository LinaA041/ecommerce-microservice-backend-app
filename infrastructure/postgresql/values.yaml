# Default values for postgresql.
replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "15"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 5432

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pg_isready -U postgres
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - pg_isready -U postgres
  initialDelaySeconds: 5
  periodSeconds: 5


postgresql:
  auth:
    username: postgres
    password: postgrespassword
    secretName: postgres-secret
    database: ecommerce_db

persistence:
  enabled: true
  storageClass: "standard"  # En Minikube usa "standard", en cloud cambia
  size: 2Gi

backup:
  enabled: true
  schedule: "0 3 * * *"
  pvcName: "postgres-backups"
  retentionDays: 7