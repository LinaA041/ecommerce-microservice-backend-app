{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
    name: {{ include "product-service.fullname" . }}-secret
    namespace: {{ .Values.namespace }}
    labels:
    {{- include "product-service.labels" . | nindent 4 }}
type: Opaque
data:
    {{- range $key, $value := .Values.secrets.data }}
    {{ $key }}: {{ $value | b64enc | quote }}
    {{- end }}
{{- end }}