name: CI/CD Pipeline - Microservicios E-commerce

on:
  push:
    branches: [ master, develop ]
    paths:
      - '*-service/**'
      - 'helm-charts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Permite ejecución manual

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  KUBE_NAMESPACE: dev
  REGISTRY: docker.io

jobs:
  # ============================================
  # JOB 1: Build & Test
  # ============================================
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: product-service, path: product-service }
          - { name: user-service, path: user-service }
          - { name: payment-service, path: payment-service }
          - { name: order-service, path: order-service }
          - { name: shipping-service, path: shipping-service }
          - { name: favourite-service, path: favourite-service }
          - { name: api-gateway, path: api-gateway }
          - { name: cloud-config, path: cloud-config }
          - { name: service-discovery, path: service-discovery }
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        working-directory: ${{ matrix.service.path }}
        run: |
          echo "Building ${{ matrix.service.name }}..."
          mvn clean package -DskipTests
          echo "Build completed"
      
      - name: Run tests
        working-directory: ${{ matrix.service.path }}
        run: |
          echo "Running tests for ${{ matrix.service.name }}..."
          mvn test
          echo "Tests passed"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-jar
          path: ${{ matrix.service.path }}/target/*.jar
          retention-days: 1

  # ============================================
  # JOB 2: Docker Build & Push
  # ============================================
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    
    strategy:
      matrix:
        service:
          - product-service
          - user-service
          - payment-service
          - order-service
          - shipping-service
          - favourite-service
          - api-gateway
          - cloud-config
          - service-discovery
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target

      - name: Debug - List downloaded files
        run: |
          echo "Contenido de ${{ matrix.service }}/target:"
          ls -lh ${{ matrix.service }}/target/
          echo ""
          echo "Archivos JAR encontrados:"
          find ${{ matrix.service }}/target/ -name "*.jar"
        #For debugging purposes only, can be removed later
      - name: Verify JAR exists
        run: |
          if [ ! -f ${{ matrix.service }}/target/*.jar ]; then
            echo "ERROR: No se encontró ningún JAR en ${{ matrix.service }}/target/"
            echo "Contenido del directorio:"
            ls -la ${{ matrix.service }}/target/
            exit 1
          fi
          echo "JAR encontrado"
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract version info
        id: version
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:build-${{ github.run_number }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.SHORT_SHA }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max

  
  # ============================================
# JOB 3: Deploy Core Services en KIND
# ============================================
  deploy-core:
    name: Deploy Core Services (KIND)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'

    steps:
      # 1. Checkout del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Crear cluster KIND en este mismo job
      - name: Create KIND cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce
          wait: 2m

      # 3. Instalar kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'

      # 4. Instalar Helm
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      # 5. Crear namespace si no existe
      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      # 6. Deploy Cloud Config
      - name: Deploy Cloud Config
        run: |
          echo "Deploying Cloud Config..."

          TAG=build-${{ github.run_number }}

          helm upgrade --install cloud-config ./helm-charts/core/cloud-config \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=$TAG \
            --wait --timeout 5m

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=cloud-config \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s

      # 7. Deploy Service Discovery
      - name: Deploy Service Discovery
        run: |
          echo "Deploying Service Discovery..."

          TAG=build-${{ github.run_number }}

          helm upgrade --install service-discovery ./helm-charts/core/service-discovery \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=$TAG \
            --wait --timeout 5m

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=service-discovery \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s

          echo "Core services deployed successfully"

      # 8. (Opcional) Listar pods para ver el estado
      - name: List running pods
        run: kubectl get pods -n ${{ env.KUBE_NAMESPACE }}


  # ============================================
  # JOB 4: Deploy Business Services (paralelo)
  # ============================================
  deploy-business:
    name: Deploy Business Services
    runs-on: ubuntu-latest
    needs: deploy-core
    
    strategy:
      matrix:
        service:
          - product-service
          - user-service
          - payment-service
          - order-service
          - shipping-service
          - favourite-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'
      
      - name: Deploy ${{ matrix.service }}
        run: |
          echo "Deploying ${{ matrix.service }}..."
          helm upgrade --install ${{ matrix.service }} ./helm-charts/services/${{ matrix.service }} \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=build-${{ github.run_number }} \
            --wait --timeout 5m
          
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=${{ matrix.service }} \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          
          echo "${{ matrix.service }} deployed"

  # ============================================
  # JOB 5: Deploy API Gateway 
  # ============================================
  deploy-gateway:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    needs: deploy-business
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'
      
      - name: Deploy API Gateway
        run: |
          echo "Deploying API Gateway..."
          helm upgrade --install api-gateway ./helm-charts/services/api-gateway \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.tag=build-${{ github.run_number }} \
            --wait --timeout 5m
          
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=api-gateway \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          
          echo "API Gateway deployed"

  # ============================================
  # JOB 6: Health Checks & Smoke Tests
  # ============================================
  health-checks:
    runs-on: ubuntu-latest
    needs: deploy-gateway

    steps:
      - uses: azure/setup-kubectl@v3

      - name: Port forward API Gateway
        run: |
          kubectl port-forward svc/api-gateway 8080:8080 -n dev &
          sleep 6

      - name: Validate Gateway Health
        run: |
          echo "Checking health..."
          curl -f http://localhost:8080/actuator/health
          echo "Gateway healthy ✔"

      - name: Smoke Test - Example Request
        run: |
          curl -f http://localhost:8080/api/products || exit 1
          echo "Smoke test passed ✔"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back services..."
          for svc in api-gateway product-service user-service payment-service order-service shipping-service favourite-service service-discovery cloud-config; do
            helm rollback $svc -n dev || true

          done
