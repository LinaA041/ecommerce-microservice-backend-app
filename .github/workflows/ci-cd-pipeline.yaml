name: CI/CD Pipeline - Microservicios E-commerce

on:
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  KUBE_NAMESPACE: dev
  REGISTRY: docker.io

jobs:
  # ============================================
  # JOB 1: Build & Test
  # ============================================
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: product-service, path: product-service }
          - { name: user-service, path: user-service }
          - { name: payment-service, path: payment-service }
          - { name: order-service, path: order-service }
          - { name: shipping-service, path: shipping-service }
          - { name: favourite-service, path: favourite-service }
          - { name: api-gateway, path: api-gateway }
          - { name: cloud-config, path: cloud-config }
          - { name: service-discovery, path: service-discovery }
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        working-directory: ${{ matrix.service.path }}
        run: |
          echo "Building ${{ matrix.service.name }}..."
          mvn clean package -DskipTests
          echo "Build completed"
      
      - name: Run tests
        working-directory: ${{ matrix.service.path }}
        run: |
          echo "Running tests for ${{ matrix.service.name }}..."
          mvn test
          echo "Tests passed"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-jar
          path: ${{ matrix.service.path }}/target/*.jar
          retention-days: 1

  # ============================================
  # JOB 2: Docker build & push
  # ============================================
  docker-build:
    name: Build & push docker images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    
    strategy:
      matrix:
        service:
          - product-service
          - user-service
          - payment-service
          - order-service
          - shipping-service
          - favourite-service
          - api-gateway
          - cloud-config
          - service-discovery
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target

      - name: Debug - List downloaded files
        run: |
          echo "Contenido de ${{ matrix.service }}/target:"
          ls -lh ${{ matrix.service }}/target/
          echo ""
          echo "Archivos JAR encontrados:"
          find ${{ matrix.service }}/target/ -name "*.jar"
      
      - name: Verify JAR exists
        run: |
          if [ ! -f ${{ matrix.service }}/target/*.jar ]; then
            echo "ERROR: No se encontró ningún JAR en ${{ matrix.service }}/target/"
            echo "Contenido del directorio:"
            ls -la ${{ matrix.service }}/target/
            exit 1
          fi
          echo "JAR encontrado"
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract version info
        id: version
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:build-${{ github.run_number }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ steps.version.outputs.SHORT_SHA }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max

  deploy-core:
    name: Deploy core services (KIND)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create KIND cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce
          wait: 3m
      
      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
      
      # CARGAR TODAS LAS IMÁGENES EN KIND
      - name: Pull images from Docker Hub
        run: |
          echo " Pulling images from Docker Hub..."
          TAG=build-${{ github.run_number }}
          
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          docker pull ${{ env.DOCKER_USERNAME }}/cloud-config:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/service-discovery:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/product-service:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/user-service:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/payment-service:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/order-service:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/shipping-service:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/favourite-service:$TAG
          docker pull ${{ env.DOCKER_USERNAME }}/api-gateway:$TAG
          
          echo " All images pulled"
      
      - name: Load images into KIND
        run: |
          echo " Loading images into KIND cluster..."
          TAG=build-${{ github.run_number }}
          
          kind load docker-image ${{ env.DOCKER_USERNAME }}/cloud-config:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/service-discovery:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/product-service:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/user-service:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/payment-service:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/order-service:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/shipping-service:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/favourite-service:$TAG --name ecommerce
          kind load docker-image ${{ env.DOCKER_USERNAME }}/api-gateway:$TAG --name ecommerce
          
          echo "All images loaded into KIND"
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Create Git credentials secret
        run: |
          kubectl create secret generic git-credentials \
            -n ${{ env.KUBE_NAMESPACE }} \
            --from-literal=username="${{ secrets.CONFIG_REPO_USERNAME }}" \
            --from-literal=password="${{ secrets.CONFIG_REPO_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Create ServiceAccount and RBAC
        run: |
          echo "Creating ServiceAccount and RBAC..."
          
          kubectl create serviceaccount microservice-sa -n ${{ env.KUBE_NAMESPACE }} || echo "ServiceAccount already exists"
          kubectl apply -f infrastructure/rbac/role.yaml -n ${{ env.KUBE_NAMESPACE }}
          kubectl apply -f infrastructure/rbac/rolebinding.yaml -n ${{ env.KUBE_NAMESPACE }}
          
          echo "ServiceAccount and RBAC configured"

      - name: Create ConfigMaps
        run: |
          echo "Creating ConfigMaps..."
          
          kubectl create configmap cloud-config-env \
            -n ${{ env.KUBE_NAMESPACE }} \
            --from-literal=SPRING_PROFILES_ACTIVE=dev \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create configmap cloud-config-application \
            -n ${{ env.KUBE_NAMESPACE }} \
            --from-file=application.yml=cloud-config/src/main/resources/application.yml \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f infrastructure/common-configmap-template.yaml -n ${{ env.KUBE_NAMESPACE }}

      # ==========================================
      # GUARDAR REVISIONES ANTERIORES (BACKUP)
      # ==========================================
      - name: Backup current Helm releases
        id: backup
        run: |
          echo "Backing up current Helm releases..."
          
          # Crear directorio para backups
          mkdir -p helm-backups
          
          # Lista de servicios a respaldar
          SERVICES=(
            "cloud-config"
            "service-discovery"
            "product-service"
            "user-service"
            "payment-service"
            "order-service"
            "shipping-service"
            "favourite-service"
            "api-gateway"
          )
          
          # Para cada servicio, guardar la revisión actual
          for service in "${SERVICES[@]}"; do
            if helm status $service -n ${{ env.KUBE_NAMESPACE }} &>/dev/null; then
              REVISION=$(helm history $service -n ${{ env.KUBE_NAMESPACE }} --max 1 -o json | jq -r '.[0].revision')
              echo "$service=$REVISION" >> helm-backups/revisions.txt
              echo "  ✓ $service: revision $REVISION"
            else
              echo "$service: not installed yet"
            fi
          done
          
          # Guardar el archivo de revisiones como artifact
          echo "BACKUP_FILE=helm-backups/revisions.txt" >> $GITHUB_OUTPUT
          echo "Backup completed"
      
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-revisions-backup
          path: helm-backups/revisions.txt
          retention-days: 7

      - name: Deploy Cloud Config
        run: |
          echo " Deploying Cloud Config..."
          TAG=build-${{ github.run_number }}

          helm upgrade --install cloud-config ./helm-charts/core/cloud-config \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_USERNAME }}/cloud-config \
            --set image.tag=$TAG \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 5m || {
              echo "Helm install failed!"
              kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
              kubectl get events -n ${{ env.KUBE_NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
              
              POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} -l app.kubernetes.io/name=cloud-config -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$POD" ]; then
                echo ""
                echo " Pod logs:"
                kubectl logs $POD -n ${{ env.KUBE_NAMESPACE }} --tail=100 || true
                
                echo ""
                echo " Pod description:"
                kubectl describe pod $POD -n ${{ env.KUBE_NAMESPACE }}
              fi
              
              exit 1
            }

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=cloud-config \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          
          echo " Cloud Config deployed"

      # ==========================================
      # GATE 1: SMOKE TEST - CLOUD CONFIG
      # ==========================================
      - name: "GATE - Cloud Config Smoke Test"
        run: |
          echo "================================================"
          echo "DEPLOYMENT GATE: Cloud Config Smoke Test"
          echo "================================================"
          
          POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} \
            -l app.kubernetes.io/name=cloud-config \
            -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing pod: $POD"
          
            retry() {
              local n=1
              local max=10
              local delay=10

              while true; do
                "$@" && break || {
                  if [[ $n -lt $max ]]; then
                    echo "Attempt $n/$max failed. Retrying in $delay seconds..."
                    sleep $delay
                    ((n++))
                  else
                    echo "Final attempt failed. Aborting."
                    return 1
                  fi
                }
              done
            }

            echo "Running health check with retries..."

            retry kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
              wget --spider -q http://localhost:9296/actuator/health

            echo "Cloud Config health OK"

            echo "Checking /actuator/info ..."
            retry kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
              wget --spider -q http://localhost:9296/actuator/info

            echo "Config endpoints OK"
            echo "GATE PASSED: Cloud Config is healthy"
          
          echo ""
          echo "GATE PASSED: Cloud Config is healthy"
          echo "================================================"

      - name: Deploy Service Discovery
        run: |
          echo "Deploying Service Discovery..."
          TAG=build-${{ github.run_number }}

          helm upgrade --install service-discovery ./helm-charts/core/service-discovery \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_USERNAME }}/service-discovery \
            --set image.tag=$TAG \
            --wait --timeout 5m

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=service-discovery \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s

          echo "Service Discovery deployed"

      # ==========================================
      # GATE 2: EUREKA REGISTRATION TEST
      # ==========================================
      - name: "GATE - Eureka Registration Test"
        run: |
          echo "================================================"
          echo "DEPLOYMENT GATE: Eureka Registration Test"
          echo "================================================"
          
          POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} \
            -l app.kubernetes.io/name=service-discovery \
            -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing Eureka on pod: $POD"
          
          # Esperar un poco para que Eureka esté completamente listo
          echo "Waiting 60s for Eureka to stabilize..."
          sleep 60
          
          # Test: Eureka UI accesible
          echo "Test: Eureka dashboard access..."
          HTTP_CODE=$(kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
            sh -c "wget --spider --server-response http://localhost:8761/ 2>&1 | grep 'HTTP/' | awk '{print \$2}' | head -1")
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Eureka dashboard not accessible (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Eureka dashboard accessible"
          
          echo ""
          echo "GATE PASSED: Eureka is ready"
          echo "================================================"
      
      - name: Ensure actuator-credentials Secret exists
        run: |
          NAMESPACE=${{ env.KUBE_NAMESPACE }}

          if ! kubectl get secret actuator-credentials -n $NAMESPACE &>/dev/null; then
            echo "Secret actuator-credentials not found, creating..."
            NEW_PASS=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32)
            
            kubectl create secret generic actuator-credentials \
              --from-literal=username=admin \
              --from-literal=password=$NEW_PASS \
              --namespace=$NAMESPACE \
              --dry-run=client -o yaml | kubectl apply -f -
              
            echo "Secret 'actuator-credentials' created"
          else
            echo "Secret actuator-credentials already exists"
          fi
      
      - name: Install SealedSecrets controller
        run: |
          kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml

      - name: Apply ecommerce TLS Sealed Secret
        run: |
          kubectl apply -f infrastructure/secrets/ecommerce-tls-sealed.yaml -n dev
      
      # DEPLOY DE BUSINESS SERVICES
      - name: Deploy Business Services
        run: |
          echo "Deploying Business Services..."
          TAG=build-${{ github.run_number }}
          
          SERVICES=(
            "product-service"
            "user-service"
            "payment-service"
            "order-service"
            "shipping-service"
            "favourite-service"
          )
          
          for service in "${SERVICES[@]}"; do
            echo "  → Deploying $service..."
            
            helm upgrade --install $service ./helm-charts/services/$service \
              --namespace ${{ env.KUBE_NAMESPACE }} \
              --set image.repository=${{ env.DOCKER_USERNAME }}/$service \
              --set image.tag=$TAG \
              --set image.pullPolicy=IfNotPresent \
              --wait --timeout 5m
            
            kubectl wait --for=condition=ready pod \
              -l app.kubernetes.io/name=$service \
              -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
            
            echo " $service deployed"
          done
          
          echo "All business services deployed"

      # ==========================================
      # GATE 3: BUSINESS SERVICES INTEGRATION TEST
      # ==========================================
      - name: "GATE - Business Services Integration Test"
        run: |
          echo "================================================"
          echo "DEPLOYMENT GATE: Business Services Test"
          echo "================================================"
          
          echo "Waiting 2 minutes for services to register in Eureka..."
          sleep 120
          
          SERVICES=(
            "product-service:8500:/product-service"
            "user-service:8700:/user-service"
            "payment-service:8400:/payment-service"
            "order-service:8300:/order-service"
            "shipping-service:8600:/shipping-service"
            "favourite-service:8800:/favourite-service"
          )
          
          FAILED=0
          
          for service_config in "${SERVICES[@]}"; do
            IFS=':' read -r service port context <<< "$service_config"
            
            echo ""
            echo "Testing $service..."
            
            POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} \
              -l app.kubernetes.io/name=$service \
              -o jsonpath='{.items[0].metadata.name}')
            
            if [ -z "$POD" ]; then
              echo "Pod not found for $service"
              FAILED=1
              continue
            fi
            
            # Test: Health endpoint
            HTTP_CODE=$(kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
              sh -c "wget --spider --server-response http://localhost:$port$context/actuator/health 2>&1 | grep 'HTTP/' | awk '{print \$2}' | head -1" 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Health check failed for $service (HTTP $HTTP_CODE)"
              FAILED=1
            else
              echo "$service is healthy"
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "GATE FAILED: Some services are not healthy"
            echo "================================================"
            exit 1
          fi
          
          echo ""
          echo "GATE PASSED: All business services are healthy"
          echo "================================================"
      
      - name: Deploy API Gateway
        run: |
          echo "Deploying API Gateway..."
          TAG=build-${{ github.run_number }}

          helm upgrade --install api-gateway ./helm-charts/services/api-gateway \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --set image.repository=${{ env.DOCKER_USERNAME }}/api-gateway \
            --set image.tag=$TAG \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 5m

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=api-gateway \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          
          echo "API Gateway deployed"

      # ==========================================
      # GATE 4: END-TO-END API GATEWAY TEST
      # ==========================================
      - name: "GATE - API Gateway End-to-End Test"
        run: |
          echo "================================================"
          echo "DEPLOYMENT GATE: API Gateway E2E Test"
          echo "================================================"
          
          echo "Waiting 1 minute for API Gateway to fully initialize..."
          sleep 60
          
          POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} \
            -l app.kubernetes.io/name=api-gateway \
            -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing API Gateway on pod: $POD"
          
          # Test 1: Gateway health
          echo ""
          echo "Test 1: Gateway health check..."
          HTTP_CODE=$(kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
            sh -c "wget --spider --server-response http://localhost:8080/actuator/health 2>&1 | grep 'HTTP/' | awk '{print \$2}' | head -1")
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API Gateway health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Gateway health check passed"
          
          # Test 2: Routes accessible
          echo ""
          echo "Test 2: Testing service routes through gateway..."
          
          # Test product-service route
          echo "  → Testing /product-service/actuator/health..."
          HTTP_CODE=$(kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
            sh -c "wget --spider --server-response http://localhost:8080/product-service/actuator/health 2>&1 | grep 'HTTP/' | awk '{print \$2}' | head -1" 2>/dev/null || echo "000")
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Product service route failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Product service route working"
          
          # Test user-service route
          echo "  → Testing /user-service/actuator/health..."
          HTTP_CODE=$(kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- \
            sh -c "wget --spider --server-response http://localhost:8080/user-service/actuator/health 2>&1 | grep 'HTTP/' | awk '{print \$2}' | head -1" 2>/dev/null || echo "000")
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "User service route failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "User service route working"
          
          echo ""
          echo "GATE PASSED: API Gateway is fully functional"
          echo "================================================"

      # ==========================================
      # GATE 5: FINAL SYSTEM INTEGRATION TEST
      # ==========================================
      - name: "GATE - Final System Integration Test"
        run: |
          echo "================================================"
          echo "FINAL DEPLOYMENT GATE: System Integration"
          echo "================================================"
          
          echo ""
          echo "Checking all services are registered in Eureka..."
          
          EUREKA_POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} \
            -l app.kubernetes.io/name=service-discovery \
            -o jsonpath='{.items[0].metadata.name}')
          
          # Obtener lista de aplicaciones registradas
          REGISTERED=$(kubectl exec -n ${{ env.KUBE_NAMESPACE }} $EUREKA_POD -- \
            sh -c "wget -qO- http://localhost:8761/eureka/apps" 2>/dev/null || echo "")
          
          # Servicios esperados
          EXPECTED_SERVICES=(
            "CLOUD-CONFIG"
            "API-GATEWAY"
            "PRODUCT-SERVICE"
            "USER-SERVICE"
            "PAYMENT-SERVICE"
            "ORDER-SERVICE"
            "SHIPPING-SERVICE"
            "FAVOURITE-SERVICE"
          )
          
          FAILED=0
          for service in "${EXPECTED_SERVICES[@]}"; do
            if echo "$REGISTERED" | grep -q "$service"; then
              echo "$service is registered in Eureka"
            else
              echo "$service NOT registered in Eureka"
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "FINAL GATE FAILED: Not all services registered"
            echo "================================================"
            exit 1
          fi
          
          echo ""
          echo "================================================"
          echo "ALL DEPLOYMENT GATES PASSED"
          echo "System is fully operational"
          echo "================================================"

      - name: Show deployment status
        run: |
          echo "================================================"
          echo "DEPLOYMENT STATUS"
          echo "================================================"
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }} -o wide
          echo ""
          kubectl get svc -n ${{ env.KUBE_NAMESPACE }}
          echo "================================================"

      # ==========================================
      # ROLLBACK AUTOMÁTICO EN CASO DE FALLO
      # ==========================================
      - name: "ROLLBACK - Automatic rollback on failure"
        if: failure()
        run: |
          echo "================================================"
          echo "DEPLOYMENT FAILED - INITIATING ROLLBACK"
          echo "================================================"
          
          # Descargar el archivo de revisiones de backup
          echo ""
          echo "Retrieving backup revisions..."
          
          if [ -f helm-backups/revisions.txt ]; then
            echo "Backup file found"
            cat helm-backups/revisions.txt
            
            echo ""
            echo "Rolling back services to previous revisions..."
            
            # Leer cada línea del archivo de backup
            while IFS='=' read -r service revision; do
              if [ -n "$service" ] && [ -n "$revision" ]; then
                echo ""
                echo "Rolling back $service to revision $revision..."
                
                # Intentar rollback
                if helm rollback $service $revision -n ${{ env.KUBE_NAMESPACE }} --wait --timeout 3m; then
                  echo "$service rolled back successfully"
                  
                  # Verificar que el rollback fue exitoso
                  kubectl wait --for=condition=ready pod \
                    -l app.kubernetes.io/name=$service \
                    -n ${{ env.KUBE_NAMESPACE }} --timeout=120s || echo "Warning: Pods not ready after rollback"
                else
                  echo "Warning: Could not rollback $service"
                fi
              fi
            done < helm-backups/revisions.txt
            
            echo ""
            echo "================================================"
            echo "ROLLBACK COMPLETED"
            echo "================================================"
            echo ""
            echo "Current status:"
            kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
            echo ""
            helm list -n ${{ env.KUBE_NAMESPACE }}
            
          else
            echo "No backup file found - this was a fresh installation"
            echo "Nothing to rollback to"
          fi
          
          echo ""
          echo "================================================"
          echo "FAILURE DIAGNOSTICS"
          echo "================================================"
          
          echo ""
          echo "Pod status:"
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          
          echo ""
          echo "Recent events:"
          kubectl get events -n ${{ env.KUBE_NAMESPACE }} --sort-by='.lastTimestamp' | tail -30
          
          echo ""
          echo "Logs from failed pods:"
          for pod in $(kubectl get pods -n ${{ env.KUBE_NAMESPACE }} --field-selector=status.phase!=Running -o name 2>/dev/null); do
            echo ""
            echo "=== Logs for $pod ==="
            kubectl logs -n ${{ env.KUBE_NAMESPACE }} $pod --tail=50 || true
          done
          
          echo ""
          echo "================================================"
          echo "Pipeline failed - system rolled back"